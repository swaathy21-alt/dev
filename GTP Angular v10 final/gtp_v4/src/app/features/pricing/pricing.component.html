<div class="fade-in">
  <div class="page-header">
    <div class="page-title">Pricing Workspace</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost">&#8593; Import XLSX</button>
      <button class="btn btn-ghost">&#8595; Export XLSX</button>
      <button class="btn btn-primary">+ Add Price</button>
    </div>
  </div>
  <div class="card-sm"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <select class="form-select" style="width:auto"><option>Global</option></select>
    <input class="form-input" style="width:200px" placeholder="Search make, model or SKU…" [(ngModel)]="search" (ngModelChange)="filterPricing()"/>
    <input type="date" class="form-input" style="width:auto"/>
    <input type="date" class="form-input" style="width:auto"/>
    <button class="btn btn-ghost btn-sm" (click)="showTrend=!showTrend">{{ showTrend ? 'Hide' : 'Show' }} Trend</button>
  </div></div>

  <div class="card" *ngIf="showTrend" style="margin-bottom:12px">
    <div style="font-weight:700;font-size:14px;margin-bottom:14px">Price Trend &mdash; iPhone 16 Pro</div>
    <div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap">
      <ttp-sparkline [data]="trendData" [months]="trendMonths" [width]="260" [height]="80"></ttp-sparkline>
      <div style="background:var(--accent-glow);border:1px solid var(--accent);border-radius:10px;padding:12px 20px">
        <div style="font-size:24px;font-weight:800;color:var(--accent)">£625</div>
        <div style="font-size:12px;color:var(--green);font-weight:600">+64% since Oct</div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:2px">Current price</div>
      </div>
    </div>
  </div>

  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Make</th><th>Model</th><th>SKU</th><th>Variant</th><th>Price</th><th>Start</th><th>End</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let p of filtered">
        <td style="color:var(--text-muted)">{{ p.make }}</td>
        <td><strong>{{ p.model }}</strong></td>
        <td class="mono" style="color:var(--text-muted);font-size:11px">{{ p.sku }}</td>
        <td style="color:var(--text-muted)">{{ p.variant }}</td>
        <td><strong style="color:var(--green)">£{{ p.price.toLocaleString() }}</strong></td>
        <td>{{ p.start }}</td><td>{{ p.end }}</td>
        <td><button class="btn btn-ghost btn-sm">Edit</button></td>
      </tr>
    </tbody>
  </table></div></div>
</div>
